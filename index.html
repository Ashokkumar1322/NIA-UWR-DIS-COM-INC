        }

            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;

        }
        .nav-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .btn-home { background-color: #27ae60; color: white; }
        .btn-home:hover { background-color: #219653; }
        .btn-back { background-color: #e67e22; color: white; }
        .btn-back:hover { background-color: #d35400; }
        .btn-forward { background-color: #3498db; color: white; }
        .btn-forward:hover { background-color: #2980b9; }
        .btn-logout { background-color: #e74c3c; color: white; float: right; margin-bottom: 20px; }
        .btn-logout:hover { background-color: #c0392b; }
        
        /* Breadcrumb Styling */
        .breadcrumb {
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
            padding: 10px 15px;
            background: #eef2f5;
            border-radius: 4px;
            border: 1px solid #dce4ec;
            display: none; /* Hidden by default */
        }
        .breadcrumb span {
            font-weight: bold;
            color: #2980b9;
        }

        .selection-area {
            margin-top: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            cursor: pointer;
            box-sizing: border-box; 
            white-space: normal;
        }
        .details-box {
            margin-top: 20px;
            padding: 20px;
            background: #eef2f5;
            border-left: 5px solid #2980b9;
            font-size: 16px;
            line-height: 1.6;
            display: none; 
        }
        .info-box {
            margin-top: 20px;
            padding: 15px;
            background: #fdfbf7;
            border-left: 5px solid #f39c12;
            font-size: 15px;
            line-height: 1.5;
            display: none; 
        }
        .details-list {
            margin: 0;
            padding-left: 20px;
        }
        .details-list li {
            margin-bottom: 10px;
        }
        .details-box h3 {
            color: #2c3e50;

            margin-top: 25px;
        }
        .details-box h4 {
            color: #34495e;
            margin-top: 15px;
            margin-bottom: 5px;

</head>

    // State Management
    let currentPath = [];
    let forwardPath = [];

    // Helper: Formats deeply nested objects cleanly into HTML
    function formatLeafContent(content) {
        if (typeof content === 'string') {
            return content;
        }
        if (typeof content === 'object' && content !== null) {
            let html = '<ul class="details-list">';
            for (const [key, value] of Object.entries(content)) {
                html += `<li><strong>${key}:</strong> ${formatLeafContent(value)}</li>`;
            }
            html += '</ul>';
            return html;
        }
        return '';
    }

        const dropdownLabel = document.getElementById('dropdownLabel');
        const detailsBox = document.getElementById('detailsBox');
        const infoBox = document.getElementById('infoBox');
        const btnForward = document.getElementById('btnForward');

            navContainer.style.display = 'none';
            breadcrumb.style.display = 'none';
        } else {
            navContainer.style.display = 'flex';
            breadcrumb.style.display = 'block';
            breadcrumb.innerHTML = `Current Path: <span>${currentPath.join(' > ')}</span>`;
        }

        btnForward.style.display = forwardPath.length > 0 ? 'inline-block' : 'none';

        let currentNode = websiteData;
        for (let i = 0; i < currentPath.length; i++) {
            currentNode = currentNode[currentPath[i]];
        }

        if (typeof currentNode === 'object' && currentNode !== null && currentNode._info) {
            infoBox.style.display = 'block';
            infoBox.innerHTML = currentNode._info;
        } else {
            infoBox.style.display = 'none';
            infoBox.innerHTML = '';
        }

        let keys = [];
        if (typeof currentNode === 'object' && currentNode !== null) {
            keys = Object.keys(currentNode).filter(k => k !== '_info');
        }

        if (keys.length > 0) {
            selectionArea.style.display = 'block';
            detailsBox.style.display = 'none';
            
            if (currentPath.length === 0) {
                dropdownLabel.innerText = "Select your Department:";
            } else {
                dropdownLabel.innerText = `Select option for ${currentPath[currentPath.length - 1]}:`;
            }

            dropdown.innerHTML = '<option value="" disabled selected>-- Please select --</option>';
            keys.forEach(key => {
                const option = document.createElement('option');
                option.value = key;
                option.text = key;
                option.title = key;
                dropdown.appendChild(option);
            });
            dropdown.selectedIndex = 0;
        } else {
            selectionArea.style.display = 'none';
            detailsBox.style.display = 'block';
            
            const title = currentPath[currentPath.length - 1];
            const contentHTML = formatLeafContent(currentNode);
            detailsBox.innerHTML = `<strong>${title}:</strong><br><br>${contentHTML}`;
        }
    }

    function handleSelection(selectedValue) {
        if (!selectedValue) return;
        currentPath.push(selectedValue);
        forwardPath = []; 
        render();
    }

    function goBack() {
        if (currentPath.length > 0) {
            forwardPath.push(currentPath.pop());
            render();
        }
    }

    function goForward() {
        if (forwardPath.length > 0) {
            currentPath.push(forwardPath.pop());
            render();
        }
    }

    function goHome() {
        currentPath = [];
        forwardPath = [];
        render();
    }

    window.onload = render;
</script>
